<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FahSai</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20viewBox%3D%220%200%2040%2040%22%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22fsSky%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%220%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%233d9fe3%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23bfe5fb%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width%3D%2240%22%20height%3D%2240%22%20rx%3D%2211%22%20fill%3D%22url%28%23fsSky%29%22/%3E%3Ccircle%20cx%3D%2227.5%22%20cy%3D%2213.5%22%20r%3D%226%22%20fill%3D%22%23ffe08a%22/%3E%3Cpath%20d%3D%22M7%2024.5c4-3%208%203%2012%200s8-3%2014%200%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222.6%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%20opacity%3D%22.95%22/%3E%3Cpath%20d%3D%22M7%2031c4-3%208%203%2012%200s8-3%2014%200%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222.6%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%20opacity%3D%22.55%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Noto+Sans+Thai:wght@400;500;700&family=Cal+Sans&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/deck.gl@9.0.16/dist.min.js"></script>
<script src="data.js"></script>
<style>
  :root {
    --ink: #f4f1ea;
    --ink-soft: rgba(244, 241, 234, 0.74);
    --ink-faint: rgba(244, 241, 234, 0.48);
    --glass: rgba(17, 19, 25, 0.72);
    --glass-strong: rgba(17, 19, 25, 0.88);
    --line: rgba(244, 241, 234, 0.13);
    --font-body: "DM Sans", "Noto Sans Thai", system-ui, sans-serif;
    --font-head: "Cal Sans", "Noto Sans Thai", "DM Sans", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, monospace;
    --r: 16px;
    --bg: #0b0c10;
    --on-ink: #111;
    --hover: rgba(244, 241, 234, 0.08);
    --good-ink: #6ee7b7;
    --good-strong: #a7f3d0;
    --joe: #fde68a;
    --dot: #fde68a;
    --attrib: rgba(0, 0, 0, 0.45);
    --label-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
  }
  /* Light theme */
  html[data-theme="light"] {
    --ink: #1b1d22;
    --ink-soft: rgba(27, 29, 34, 0.72);
    --ink-faint: rgba(27, 29, 34, 0.5);
    --glass: rgba(255, 255, 255, 0.8);
    --glass-strong: rgba(255, 255, 255, 0.94);
    --line: rgba(27, 29, 34, 0.12);
    --bg: #f2f3f0;
    --on-ink: #fff;
    --hover: rgba(27, 29, 34, 0.06);
    --good-ink: #047857;
    --good-strong: #065f46;
    --joe: #b45309;
    --dot: #d97706;
    --attrib: rgba(255, 255, 255, 0.7);
    --label-shadow: 0 4px 14px rgba(27, 29, 34, 0.18);
  }
  html[data-theme="light"] .glass, html[data-theme="light"] #search { box-shadow: 0 6px 24px rgba(27, 29, 34, 0.08); }
  html[data-theme="light"] #toast { box-shadow: 0 18px 50px rgba(27, 29, 34, 0.22); border: 1px solid rgba(27,29,34,0.08); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font-body); overflow: hidden; }
  button, input { font: inherit; color: inherit; }
  #map { position: fixed; inset: 0; }
  .maplibregl-ctrl-attrib { background: var(--attrib) !important; font-size: 10px; }
  .maplibregl-ctrl-attrib a { color: var(--ink-faint) !important; }
  .glass { background: var(--glass); border: 1px solid var(--line); border-radius: var(--r); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }

  /* Top bar */
  #top { position: fixed; left: 20px; right: 20px; top: 18px; display: flex; gap: 14px; align-items: center; pointer-events: none; }
  #top > * { pointer-events: auto; }
  #brandbox { display: flex; align-items: center; gap: 12px; padding: 10px 16px 10px 12px; }
  #logo { width: 36px; height: 36px; flex: none; }
  #logo svg { display: block; border-radius: 11px; box-shadow: 0 2px 10px rgba(61, 159, 227, 0.35); }
  #brand { font-family: var(--font-head); font-size: 22px; line-height: 1; }
  #live { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-soft); margin-top: 4px; }
  #live i { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; animation: pulse 1.6s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.6); } 70% { box-shadow: 0 0 0 9px rgba(239,68,68,0); } 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); } }
  #live b { color: var(--ink); font-weight: 500; font-family: var(--font-mono); font-size: 12px; }

  #searchbox { position: relative; flex: 1; max-width: 440px; margin: 0 auto; }
  #search { width: 100%; padding: 14px 18px 14px 44px; border-radius: 999px; border: 1px solid var(--line); background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); font-size: 15.5px; outline: none; }
  #search::placeholder { color: var(--ink-faint); }
  #search:focus { border-color: var(--ink-faint); }
  #searchbox svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); opacity: 0.6; }
  #results { position: absolute; left: 0; right: 0; top: calc(100% + 6px); padding: 6px; display: none; max-height: 320px; overflow: auto; background: var(--glass-strong); }
  #results.on { display: block; }
  .res { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; cursor: pointer; font-size: 14.5px; }
  .res:hover, .res.sel { background: var(--hover); }
  .res .pm { font-family: var(--font-mono); font-size: 13px; padding: 2px 8px; border-radius: 999px; color: #111; }



  /* Side panel */
  #panel { position: fixed; right: 20px; top: 92px; width: 340px; padding: 20px; transition: opacity .5s ease, transform .5s ease; max-height: calc(100vh - 150px); overflow: auto; }
  #panel.off { opacity: 0; transform: translateX(16px); pointer-events: none; }
  .k { font-size: 12px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .08em; }
  .pname { font-family: var(--font-head); font-size: 26px; line-height: 1.1; margin: 6px 0 14px; }
  .bignum { display: flex; align-items: baseline; gap: 10px; }
  .bignum .n { font-family: var(--font-head); font-size: 68px; line-height: 0.9; }
  .bignum .u { font-size: 13px; color: var(--ink-soft); }
  .badge { display: inline-block; margin-top: 10px; padding: 4px 11px; border-radius: 999px; font-size: 13px; font-weight: 500; color: #111; }
  .meta { margin-top: 12px; font-size: 13px; color: var(--ink-soft); display: flex; align-items: center; gap: 7px; }
  .meta .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dot); box-shadow: 0 0 8px var(--dot); }
  .spark { margin-top: 16px; }
  .spark svg { width: 100%; height: 56px; display: block; }
  .spark .ax { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-faint); margin-top: 3px; }
  .near { margin-top: 16px; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(52,211,153,0.4); background: rgba(52,211,153,0.08); cursor: pointer; }
  .near:hover { background: rgba(52,211,153,0.14); }
  .near .t { font-size: 12px; color: var(--good-ink); text-transform: uppercase; letter-spacing: .08em; }
  .near .r { display: flex; justify-content: space-between; align-items: baseline; margin-top: 5px; }
  .near .nm { font-weight: 700; font-size: 15.5px; }
  .near .v { font-family: var(--font-head); font-size: 28px; }
  .near .d { font-size: 13px; color: var(--ink-soft); margin-top: 2px; }
  .cta { margin-top: 16px; width: 100%; padding: 13px 16px; border-radius: 12px; border: 0; cursor: pointer; background: var(--ink); color: var(--on-ink); font-weight: 700; font-size: 15px; display: flex; justify-content: center; align-items: center; gap: 8px; }
  .cta.done { background: rgba(52,211,153,0.18); color: var(--good-strong); border: 1px solid rgba(52,211,153,0.45); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .stat { padding: 11px 12px; border-radius: 12px; background: var(--hover); }
  .stat .v { font-family: var(--font-mono); font-size: 20px; margin-top: 3px; }
  .hint { margin-top: 14px; font-size: 14px; color: var(--ink-soft); line-height: 1.45; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; cursor: pointer; }
  .row:hover .nm { text-decoration: underline; }
  .row .pm { font-family: var(--font-mono); font-size: 13px; padding: 2px 8px; border-radius: 999px; color: #111; }

  #lang { display: flex; padding: 4px; border-radius: 999px; }
  #lang button { border: 0; background: transparent; padding: 8px 14px; border-radius: 999px; cursor: pointer; font-size: 14px; color: var(--ink-soft); }
  #lang button.on { background: var(--ink); color: var(--on-ink); font-weight: 500; }
  #themeBtn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; color: var(--ink); padding: 0; }
  #themeBtn svg { width: 19px; height: 19px; }

  /* Labels on the map (web text, so Thai marks show correctly) */
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .lbl { position: absolute; left: 0; top: 0; white-space: nowrap; font-weight: 700; border-radius: 8px; will-change: transform, opacity; }
  .lbl.ev { font-size: 14px; padding: 4px 9px; color: #111; box-shadow: var(--label-shadow); }
  .lbl.wl { font-size: 20px; padding: 6px 12px; color: #fff; box-shadow: var(--label-shadow); }

  .cta.ghost { background: transparent; color: var(--ink); border: 1px solid var(--ink-faint); margin-top: 10px; }
  .cta.ghost:hover { background: var(--hover); }
  .back { border: 0; background: transparent; color: var(--ink-soft); cursor: pointer; padding: 0; font-size: 13px; margin-bottom: 8px; }
  .back:hover { color: var(--ink); }
  .opt { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; margin-top: 10px; border: 1px solid; }
  .opt.clean { border-color: rgba(52,211,153,0.55); background: rgba(52,211,153,0.10); }
  .opt.fast { border-color: rgba(239,68,68,0.45); background: rgba(239,68,68,0.07); }
  .opt .l { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .opt .l i { width: 18px; height: 5px; border-radius: 3px; display: inline-block; }
  .opt .s { font-size: 13px; color: var(--ink-soft); margin-top: 3px; }
  .opt .v { font-family: var(--font-head); font-size: 26px; }
  .gain { margin-top: 16px; font-family: var(--font-head); font-size: 24px; line-height: 1.2; color: var(--good-strong); }
  .avoid { margin-top: 6px; font-size: 13.5px; color: var(--ink-soft); }
  .lbl.pin { font-size: 14px; padding: 5px 10px; color: #111; }

  #panel .close { position: absolute; right: 12px; top: 12px; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--hover); cursor: pointer; display: grid; place-items: center; color: var(--ink-soft); font-size: 18px; line-height: 1; }
  #panel .close:hover { background: var(--line); color: var(--ink); }

  /* Live readings feed */
  #feed { position: fixed; left: 20px; bottom: 150px; width: 300px; padding: 12px 14px 8px; }
  #feed .k { display: flex; align-items: center; gap: 7px; }
  #feed .k i { width: 7px; height: 7px; border-radius: 50%; background: var(--dot); box-shadow: 0 0 8px var(--dot); }
  #feedList { margin-top: 6px; }
  .fe { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13px; animation: feedIn .5s ease; }
  .fe:first-child { border-top: 0; }
  .fe .who { color: var(--ink); font-weight: 500; white-space: nowrap; }
  .fe .who.joe { color: var(--joe); }
  .fe .st { color: var(--ink-soft); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fe .pm { font-family: var(--font-mono); font-size: 12px; padding: 2px 7px; border-radius: 999px; color: #111; }
  @keyframes feedIn { from { opacity: 0; transform: translateY(-6px); background: rgba(253,230,138,0.12); } to { opacity: 1; transform: none; background: transparent; } }

  /* Legend */
  #legend { position: fixed; left: 20px; bottom: 34px; width: 250px; padding: 12px 16px; transition: opacity .5s; }
  #legend.off { opacity: 0; }
  #legend .bar { height: 9px; border-radius: 6px; margin-top: 8px; background: linear-gradient(90deg, #34d399 0%, #34d399 18%, #facc15 34%, #fb923c 55%, #ef4444 77%, #be185d 100%); }
  #legend .ticks { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); margin-top: 5px; }
  #legend .keys { display: flex; gap: 14px; margin-top: 10px; font-size: 12px; color: var(--ink-soft); }
  #legend .keys span { display: flex; align-items: center; gap: 6px; }
  #legend .keys i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  #lgDot { background: #fff7e6; box-shadow: 0 0 6px #fde68a; }
  html[data-theme="light"] #lgDot { background: #1b1d22; box-shadow: 0 0 0 2px #fff; }

  /* Alert toast (phone notification) */
  #toast { position: fixed; right: 20px; bottom: 34px; width: 360px; padding: 14px 16px; border-radius: 18px; background: rgba(246, 246, 244, 0.97); color: #15171c; box-shadow: 0 18px 50px rgba(0,0,0,0.45); transform: translateY(calc(100% + 60px)); transition: transform .7s cubic-bezier(.2,.9,.25,1.15); }
  #toast.on { transform: translateY(0); }
  #toast .h { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #555; }
  #toast .h .app { width: 20px; height: 20px; border-radius: 6px; background: #06c755; display: grid; place-items: center; color: white; font-size: 10px; font-weight: 700; }
  #toast .h .when { margin-left: auto; }
  #toast .b { margin-top: 8px; font-size: 15px; line-height: 1.4; }
  #toast .b b { font-weight: 700; }

  #note { position: fixed; left: 20px; bottom: 10px; font-size: 11px; color: var(--ink-faint); pointer-events: none; }

  @media (max-width: 760px) {
    #top { left: 12px; right: 12px; top: 12px; flex-wrap: wrap; gap: 8px; }
    #searchbox { order: 3; max-width: none; flex-basis: 100%; }
    #lang { margin-left: auto; }
    #themeBtn { width: 40px; height: 40px; }
    #panel { left: 12px; right: 12px; width: auto; top: auto; bottom: 30px; max-height: 46vh; }
    #legend, #feed { display: none; }
    #toast { left: 12px; right: 12px; width: auto; top: 12px; bottom: auto; transform: translateY(-160%); }
    #toast.on { transform: translateY(0); }
  }
</style>
</head>
<body>
<div id="map"></div>


<div id="top">
  <div id="brandbox" class="glass">
    <div id="logo"><svg viewBox="0 0 40 40" width="36" height="36" aria-hidden="true"><defs><linearGradient id="fsSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d9fe3"/><stop offset="1" stop-color="#bfe5fb"/></linearGradient></defs><rect width="40" height="40" rx="11" fill="url(#fsSky)"/><circle cx="27.5" cy="13.5" r="6" fill="#ffe08a"/><path d="M7 24.5c4-3 8 3 12 0s8-3 14 0" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" opacity=".95"/><path d="M7 31c4-3 8 3 12 0s8-3 14 0" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" opacity=".55"/></svg></div>
    <div>
      <div id="brand">FahSai</div>
      <div id="live"><i></i><span id="liveTxt"></span></div>
    </div>
  </div>
  <div id="searchbox">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input id="search" placeholder="Search your soi, e.g. Nimman Soi 7" autocomplete="off" spellcheck="false">
    <div id="results" class="glass"></div>
  </div>
  <div id="lang" class="glass"><button data-l="en">EN</button><button data-l="th">ไทย</button></div>
  <button id="themeBtn" class="glass" aria-label="Light or dark"></button>
</div>
<div id="labels"></div>

<div id="panel" class="glass off"></div>

<div id="legend" class="glass">
  <div class="k" style="text-transform:none;letter-spacing:.02em" id="lgTitle"></div>
  <div class="bar"></div>
  <div class="ticks"><span>0</span><span>50</span><span>100</span><span>150</span><span>220+</span></div>
  <div class="keys"><span><i id="lgDot"></i><span id="lgRider"></span></span><span><i style="background:rgba(239,68,68,.55)"></i><span id="lgSmoke"></span></span></div>
</div>

<div id="feed" class="glass">
  <div class="k"><i></i><span id="feedTitle"></span></div>
  <div id="feedList"></div>
</div>

<div id="toast">
  <div class="h"><div class="app">L</div><span>LINE · <span id="toastApp">FahSai</span></span><span class="when" id="toastNow"></span></div>
  <div class="b" id="toastBody"></div>
</div>


<script>
(() => {
  const D = window.SOI_DATA;
  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const L = {
    en: {
      brand: "FahSai",
      live: (n, a) => `<b>${n}</b> riders online · updated <b>${a}</b> s ago`,
      search: "Search your soi, e.g. Nimman Soi 7",
      lgTitle: "PM2.5 (µg/m³)", lgRider: "Rider sending data", lgSmoke: "Smoke",
      feedTitle: "Live readings from riders",
      rider: n => `Rider ${n}`, joe: "Joe", unnamed: "Unnamed soi",
      yourStreet: "Your street", unit: "PM2.5 µg/m³",
      bands: ["Very good", "Good", "Moderate", "Starts to affect health", "Affects health"],
      measured: n => `Measured by ${n} riders in the last 10 minutes`,
      last12: "Last 12 hours", now: "now",
      cleaner: "Cleaner air nearby",
      away: (m, x) => `${m} m away · ${x}× less smoke`,
      alert: "Alert me on LINE", alertOn: n => `✓ Alerts on for ${n}`,
      toastNear: (a, pa, b, m, pb) => `Smoke on <b>${a}</b> is <b>${pa}</b> now. <b>${b}</b>, ${m} m away, is <b>${pb}</b>. Take ${b}.`,
      toastOnly: (a, pa) => `Smoke on <b>${a}</b> is <b>${pa}</b> now. We will tell you when it is clean.`,
      close: "Close",
      routeFrom: "Clean route from here", whereTo: "Where to?", routeTitle: "Clean route",
      cleanName: "Clean route", fastName: "Fastest",
      minAir: (m, a) => `${m} min · air on the way ${a}`,
      gain: (p, x) => x > 0 ? `${p}% less smoke for ${x} more min` : `${p}% less smoke, same time`,
      same: "The fastest route is also the cleanest.",
      avoid: n => `Avoids ${n}`,
      sendRoute: "Send route to LINE", sent: "✓ Sent to LINE",
      toastRoute: (to, m, p, av) => `Clean route to <b>${to}</b>: ${m} min, <b>${p}% less smoke</b>.${av ? ` Avoid ${av}.` : ""}`,
      back: "← Back",
      fastLbl: m => `Fastest · ${m} min`, cleanLbl: m => `Clean · ${m} min`,
    },
    th: {
      brand: "ฟ้าใส",
      live: (n, a) => `ไรเดอร์ออนไลน์ <b>${n}</b> คน · อัปเดต <b>${a}</b> วินาทีที่แล้ว`,
      search: "ค้นหาซอยของคุณ เช่น นิมมานฯ ซอย 7",
      lgTitle: "PM2.5 (มคก./ลบ.ม.)", lgRider: "ไรเดอร์กำลังส่งข้อมูล", lgSmoke: "ควัน",
      feedTitle: "ค่าฝุ่นสดจากไรเดอร์",
      rider: n => `ไรเดอร์ ${n}`, joe: "โจ", unnamed: "ซอยไม่มีชื่อ",
      yourStreet: "ถนนของคุณ", unit: "PM2.5 มคก./ลบ.ม.",
      bands: ["ดีมาก", "ดี", "ปานกลาง", "เริ่มมีผลกระทบต่อสุขภาพ", "มีผลกระทบต่อสุขภาพ"],
      measured: n => `วัดโดยไรเดอร์ ${n} คน ใน 10 นาทีล่าสุด`,

        const dx = (b[0] - a[0]) * M_LON, dy = (b[1] - a[1]) * M_LAT, len = Math.hypot(dx, dy) || 1, W = 6;
        const ox = (-dy / len) * W / M_LON, oy = (dx / len) * W / M_LAT;

  }
  let walls = [], wallLabels = [];

  // ---------- Live readings ----------
  const pmOfWay = w => { const st = w >= 0 ? wayStreet[w] : null; return st ? st.pm : 120; };
  const fade = ms => ms < 250 ? ms / 250 : ms > 2400 ? Math.max(0, 1 - (ms - 2400) / 600) : 1;
  let lastRiders = null, events = [], feedCount = 0;
  function onScreen(p) { const c = map.project(p); return c.x > 60 && c.x < innerWidth - (S.sel ? 400 : 60) && c.y > 110 && c.y < innerHeight - 60; }
  function pushReading() {
    if (!lastRiders || document.hidden) return;
    const recent = new Set(events.slice(0, 3).map(e => e.key));
    const ok = i => { const r = lastRiders[i]; const st = r.way >= 0 ? wayStreet[r.way] : null; return r.moving && st && !st.key.startsWith("#") && !recent.has(st.key) && onScreen(r.pos); };
    let pick = -1;
    if (feedCount % 5 === 2 && ok(0)) pick = 0; // Joe shows up now and then
    for (let tries = 0; pick < 0 && tries < 60; tries++) { const i = Math.floor(Math.random() * riders.length); if (ok(i)) pick = i; }
    if (pick < 0) return;
    const r = lastRiders[pick], st = wayStreet[r.way];
    const e = { key: st.key, rider: pick, pm: Math.round(st.pm + (Math.random() - 0.5) * 6),
      street: st.segs.map(i => segs[i].path), born: clock == null ? performance.now() : clock };
    events = [e, ...events].slice(0, 6); feedCount++;
    renderFeed(true);
    ago = 0; renderLive();
  }
  function renderFeed(animate) {
    $("feedList").innerHTML = events.slice(0, 4).map((e, i) =>
      `<div class="fe" style="${animate && i === 0 ? "" : "animation:none"}"><span class="who ${e.rider === 0 ? "joe" : ""}">${riderName(e.rider)}</span><span class="st">${nm(streets.get(e.key))}</span><span class="pm" style="background:${css(color(e.pm))}">${e.pm}</span></div>`).join("");
  }
  setInterval(pushReading, 1800);

  // ---------- Map labels as web text ----------

  function placeLabels(list) {
    const vp = overlay._deck && overlay._deck.getViewports && overlay._deck.getViewports()[0];
    const seen = new Set();
    for (const l of list) {
      let el = labelEls.get(l.id);
      if (!el) { el = document.createElement("div"); $("labels").appendChild(el); labelEls.set(l.id, el); }
      seen.add(l.id);
      const [x, y] = vp ? vp.project(l.pos) : (() => { const p = map.project([l.pos[0], l.pos[1]]); return [p.x, p.y]; })();
      el.className = "lbl " + l.cls; el.textContent = l.text; el.style.background = l.bg; el.style.opacity = l.op.toFixed(3);
      el.style.transform = `translate(${x.toFixed(1)}px, ${(y + l.dy).toFixed(1)}px) translate(-50%, -100%)`;
    }

  }

  // ---------- Render loop ----------
  const T0 = performance.now();
  const smokeParams = { depthWriteEnabled: false };
  let clock = null; // for still pictures: a fixed time
  function frame(nowReal) {
    const now = clock == null ? nowReal : clock;
    const sec = (now - T0) / 1000;
    S.mix += (S.mode - S.mix) * (clock == null ? 0.045 : 1);
    const m = S.mix;
    const selP = S.sel ? ease(clamp01((now - S.selT) / 1600)) : 0;
    const nearA = clamp01((map.getZoom() - 14.6) / 1.4);

    const drift = p => { const f = (sec * 0.05 * p.sp + p.ph) % 1; return [(f - 0.5) * DRIFT, Math.sin(Math.PI * f)]; };
    const layers = [];

    // 1. Street lines on the ground
    layers.push(new deck.PathLayer({
      id: "streets", data: segs, getPath: d => d.path, pickable: m > 0.5,
      getColor: d => [...shade(d.c), theme === "light" ? 255 : 235],
      getWidth: 9, widthUnits: "meters", widthMinPixels: 1.6, capRounded: true,
      updateTriggers: { getColor: theme },
      autoHighlight: true, highlightColor: [255, 255, 255, 200],
      onClick: info => { if (info.object) select(info.object.key, true); },

    // 2. Smoke: soft coloured puffs that drift, thick over the bad streets

      getPosition: d => { const [o] = drift(d); return [d.x + WIND[0] * o / M_LON, d.y + WIND[1] * o / M_LAT, d.z]; },
      getSize: d => d.size, sizeUnits: "meters", billboard: true, alphaCutoff: 0,

        getSize: d => d.size, sizeUnits: "meters", billboard: true, alphaCutoff: 0,

      getColor: d => { const a = Math.max(0, 1 - (now - d.born) / 3000); return [...P().flash, Math.round((theme === "light" ? 140 : 220) * a * a)]; },
      updateTriggers: { getColor: now },

    layers.push(new deck.ScatterplotLayer({
      id: "event-rings", data: live, getPosition: d => d.rider === null ? d.pos : rp[d.rider].pos, stroked: true, filled: false,
      getRadius: d => { const ph = Math.min(1, (now - d.born) / 1400); return 15 + 160 * ph; },
      getLineColor: d => { const ph = Math.min(1, (now - d.born) / 1400); return [...color(d.pm), Math.round(255 * (1 - ph))]; },
      lineWidthMinPixels: 2.5, radiusMaxPixels: 90, updateTriggers: { getRadius: now, getLineColor: now, getPosition: now },
    }));
    layers.push(new deck.ScatterplotLayer({
      id: "rider-glow", data: rp, getPosition: d => d.pos, getRadius: 30, radiusMinPixels: 5, radiusMaxPixels: 12,
      getFillColor: P().glow, updateTriggers: { getPosition: now, getFillColor: theme },
    }));
    layers.push(new deck.ScatterplotLayer({
      id: "riders", data: rp, getPosition: d => d.pos, getRadius: 9, radiusMinPixels: 2.6, radiusMaxPixels: 5,
      getFillColor: P().rider, stroked: theme === "light", getLineColor: [255, 255, 255], lineWidthMinPixels: 1,
      updateTriggers: { getPosition: now, getFillColor: theme },

    const labelList = live.map(e => ({ id: "e" + e.born, pos: [...rp[e.rider].pos, 0], dy: -12, cls: "ev", op: fade(now - e.born),

        getColor: d => [...color(d.pm), Math.round(110 * selP)], updateTriggers: { getColor: selP },

        id: "plume-core", data: glowSegs, getPath: d => d.path, getWidth: 9, widthUnits: "meters", widthMinPixels: 3, capRounded: true, jointRounded: true,
        getColor: d => [...color(d.pm), Math.round(255 * selP)], updateTriggers: { getColor: selP },
      }));
      const driftP = p => { const f = (sec * 0.09 * p.sp + p.ph) % 1; return [(f - 0.5) * 16, Math.sin(Math.PI * f), f]; };
      layers.push(new deck.IconLayer({
        id: "plume", data: plume, iconAtlas: PUFF_URL, iconMapping: PUFF_MAP, getIcon: d => d.ic,
        getPosition: d => { const [o, , f] = driftP(d); return [d.x + d.ux * o / M_LON, d.y + d.uy * o / M_LAT, (d.z + f * 14) * selP]; },
        getSize: d => d.size, sizeUnits: "meters", billboard: true, alphaCutoff: 0,
        getColor: d => { const [, e] = driftP(d), a = clamp01((d.pm - 40) / 190); return [...smogColor(d.pm, 0.25), Math.round((22 + 115 * a) * (1 - 0.55 * d.h) * e * selP)]; },
        updateTriggers: { getPosition: now, getColor: now }, parameters: smokeParams,
      }));
      for (const w of wallLabels) labelList.push({ id: "w" + w.key, pos: [w.pos[0], w.pos[1], (8 + w.pm * 0.38) * selP + 12], dy: -6, cls: "wl", op: selP,

  }

  // ---------- Live counters ----------
  let ago = 2, online = 287;
  function renderLive() { $("liveTxt").innerHTML = t().live(online, ago); }
  setInterval(() => {

    online = 280 + Math.floor(Math.random() * 14);
    renderLive();
    if (S.sel) { const el = document.querySelector("#panel .bignum .n"); const st = streets.get(S.sel); if (el && st) el.textContent = Math.round(st.pm + (Math.random() - 0.5) * 4); }
  }, 1000);

  // ---------- Panel ----------
  function sparkSVG(st) {
    const h = st.hist, max = Math.max(...h, 60), W = 300, H = 56;
    const pts = h.map((v, i) => [i / (h.length - 1) * W, H - 4 - (v / max) * (H - 10)]);
    const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
    const c = css(color(st.pm));
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${d} L ${W} ${H} L 0 ${H} Z" fill="${c}" opacity="0.18"/><path d="${d}" fill="none" stroke="${c}" stroke-width="2.2" vector-effect="non-scaling-stroke"/></svg>`;
  }
  function cleanerNear(st) {
    let best = null, score = Infinity;
    for (const o of named) {
      if (o.key === st.key) continue;
      const d = distM(o.c, st.c); if (d > 450) continue;
      const sc = o.pm + d * 0.2; if (o.pm < st.pm * 0.6 && sc < score) { score = sc; best = o; }
    }
    return best;
  }
  function streetPanel(st, near) {
    S.near = near; S.alerted = S.alerted === st.key ? st.key : null;
    const c = color(st.pm), T = t();
    const d = new Date(), f = h => `${String((d.getHours() + 24 + h) % 24).padStart(2, "0")}:00`;
    $("panel").innerHTML = `
      <button class="close" id="closeBtn" aria-label="${T.close}">×</button>
      <div class="k">${T.yourStreet}</div>
      <div class="pname">${nm(st)}</div>
      <div class="bignum"><span class="n">${st.pm}</span><span class="u">${T.unit}</span></div>
      <span class="badge" style="background:${css(c)}">${band(st.pm)}</span>
      <div class="meta"><span class="dot"></span>${T.measured(st.riders)}</div>
      <div class="spark"><div class="k">${T.last12}</div>${sparkSVG(st)}<div class="ax"><span>${f(-12)}</span><span>${f(-6)}</span><span>${T.now}</span></div></div>
      ${near ? `<div class="near" id="nearBtn"><div class="t">${T.cleaner}</div>
        <div class="r"><span class="nm">${nm(near)}</span><span class="v" style="color:${css(color(near.pm))}">${near.pm}</span></div>
        <div class="d">${T.away(Math.round(distM(near.c, st.c) / 10) * 10, (st.pm / near.pm).toFixed(1).replace(".0", ""))}</div></div>` : ""}
      <button class="cta ${S.alerted ? "done" : ""}" id="alertBtn">${S.alerted ? T.alertOn(nm(st)) : T.alert}</button>
      <button class="cta ghost" id="routeBtn">${T.routeFrom}</button>`;
    S.view = "street";
    if (near) $("nearBtn").onclick = () => select(near.key, true);
    $("alertBtn").onclick = () => { if (!S.alerted) alertMe(st, near); };
    $("closeBtn").onclick = () => clearSel(false);
    $("routeBtn").onclick = () => routeChooser(st);
    $("panel").classList.remove("off");
  }
  function routeChooser(st) {
    const T = t(); S.view = "choose";
    $("panel").innerHTML = `
      <button class="close" id="closeBtn" aria-label="${T.close}">×</button>
      <button class="back" id="backBtn">${T.back}</button>
      <div class="k">${T.routeTitle}</div>
      <div class="pname">${T.whereTo}</div>
      ${PLACES.map(pl => `<div class="row" data-id="${pl.id}"><span class="nm">${placeName(pl)}</span><span>→</span></div>`).join("")}`;
    $("closeBtn").onclick = () => clearSel(false);
    $("backBtn").onclick = () => streetPanel(st, S.near);
    $("panel").querySelectorAll(".row").forEach(el => el.onclick = () => startRoute(st, PLACES.find(p => p.id === el.dataset.id)));
  }
  function routeSummary(rt) {
    const pct = Math.round((1 - rt.clean.E / rt.fast.E) * 100), extra = Math.round((rt.clean.T - rt.fast.T) / 60);
    // the worst named street on the fastest route that the clean route does not use
    const score = new Map(), add = (i, sign) => { const k = segs[i].key; if (k.startsWith("#") || k === rt.st.key) return; score.set(k, (score.get(k) || 0) + sign * segs[i].len * segs[i].pm); };
    rt.fast.segList.forEach(i => add(i, 1)); rt.clean.segList.forEach(i => add(i, -1));
    let av = null, bs = 20000; for (const [k, v] of score) if (v > bs) { bs = v; av = k; }
    return { pct, extra, avoid: av ? streets.get(av) : null };
  }
  function routePanel() {
    const rt = S.route, T = t(), sm = routeSummary(rt); S.view = "route";
    const mins = r => Math.max(1, Math.round(r.T / 60));
    $("panel").innerHTML = `
      <button class="close" id="closeBtn" aria-label="${T.close}">×</button>
      <button class="back" id="backBtn">${T.back}</button>
      <div class="k">${T.routeTitle}</div>
      <div class="pname" style="font-size:22px">${nm(rt.st)} → ${placeName(rt.place)}</div>
      <div class="opt clean"><div><div class="l"><i style="background:#6ee7b7"></i>${T.cleanName}</div><div class="s">${T.minAir(mins(rt.clean), Math.round(rt.clean.avg))}</div></div><div class="v" style="color:${css(color(rt.clean.avg))}">${Math.round(rt.clean.avg)}</div></div>
      <div class="opt fast"><div><div class="l"><i style="background:#f87171"></i>${T.fastName}</div><div class="s">${T.minAir(mins(rt.fast), Math.round(rt.fast.avg))}</div></div><div class="v" style="color:${css(color(rt.fast.avg))}">${Math.round(rt.fast.avg)}</div></div>
      <div class="gain">${sm.pct >= 5 ? T.gain(sm.pct, sm.extra) : T.same}</div>
      ${sm.avoid && sm.pct >= 5 ? `<div class="avoid">${T.avoid(nm(sm.avoid))}</div>` : ""}
      <button class="cta ${rt.sent ? "done" : ""}" id="sendBtn">${rt.sent ? T.sent : T.sendRoute}</button>`;
    $("closeBtn").onclick = () => clearSel(false);
    $("backBtn").onclick = () => select(rt.st.key, true);
    $("sendBtn").onclick = () => {
      if (rt.sent) return; rt.sent = true; $("sendBtn").classList.add("done"); $("sendBtn").textContent = t().sent;
      routeToast(); setTimeout(() => $("toast").classList.add("on"), 1500); setTimeout(() => $("toast").classList.remove("on"), 10000);
    };
    $("panel").classList.remove("off");
  }
  function routeToast() {
    const rt = S.route, sm = routeSummary(rt);
    $("toastBody").innerHTML = t().toastRoute(placeName(rt.place), Math.max(1, Math.round(rt.clean.T / 60)), sm.pct, sm.avoid ? nm(sm.avoid) : "");
  }
  function startRoute(st, place) {
    const token = ++S.token;
    // start on the street itself: the point of the street nearest to its middle
    let src = -1, bd = Infinity;
    for (const i of st.segs) for (const q of segs[i].path) { const n = nodeId.get(Math.round(q[0] * 1e5) + "," + Math.round(q[1] * 1e5)); if (n !== undefined && mainNet[n]) { const d = distM(q, st.c); if (d < bd) { bd = d; src = n; } } }
    if (src < 0) src = nearestNode(st.c);
    const dst = nearestNode(place.pos);
    const fast = shortest(src, dst, false), clean = shortest(src, dst, true);
    S.sel = st.key; S.route = { st, place, fast, clean, born: Infinity, sent: false };
    $("panel").classList.add("off"); $("toast").classList.remove("on");
    let x0 = 180, y0 = 90, x1 = -180, y1 = -90;
    for (const p of [...fast.coords, ...clean.coords]) { x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); }
    const wide = innerWidth > 760;
    const cam = map.cameraForBounds([[x0, y0], [x1, y1]], { bearing: -15, maxZoom: 16.5,
      padding: wide ? { top: 150, bottom: 90, left: 340, right: 410 } : { top: 140, bottom: innerHeight * 0.5, left: 30, right: 30 } });
    const arrive = () => { if (token !== S.token) return; S.route.born = clock == null ? performance.now() : clock; routePanel(); };
    if (clock != null || !cam) { if (cam) map.jumpTo({ ...cam, pitch: 48 }); arrive(); return; }
    map.flyTo({ center: cam.center, zoom: cam.zoom, bearing: -15, pitch: 48, duration: 3000, curve: 1.2, easing: ease, essential: true });
    map.once("moveend", arrive);
  }
  function toastText(st, near) {
    $("toastBody").innerHTML = near
      ? t().toastNear(nm(st), st.pm, nm(near), Math.round(distM(near.c, st.c) / 10) * 10, near.pm)
      : t().toastOnly(nm(st), st.pm);
  }
  function alertMe(st, near) {
    S.alerted = st.key;
    const b = $("alertBtn"); b.classList.add("done"); b.textContent = t().alertOn(nm(st));
    toastText(st, near);
    setTimeout(() => $("toast").classList.add("on"), 1800);
    setTimeout(() => $("toast").classList.remove("on"), 10000);
  }

  // ---------- Selection ----------
  function select(key, fly) {
    const st = streets.get(key); if (!st) return;
    const near = cleanerNear(st);
    const token = ++S.token;
    S.sel = key; S.selT = Infinity; S.alerted = null; S.route = null;
    buildPlume([key, near && near.key].filter(Boolean));
    const lab = s => { const ss = s.segs.map(i => segs[i]); const mid = ss[Math.floor(ss.length / 2)].path[0]; return { key: s.key, pos: mid, pm: s.pm }; };
    wallLabels = [lab(st), near && lab(near)].filter(Boolean);
    $("panel").classList.add("off"); $("toast").classList.remove("on");
    const arrive = () => {
      if (token !== S.token) return;
      S.selT = clock == null ? performance.now() : clock;
      streetPanel(st, near);
    };
    let x0 = 180, y0 = 90, x1 = -180, y1 = -90;
    for (const s of [st, near].filter(Boolean)) for (const i of s.segs) for (const p of segs[i].path) { x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); }
    const wide = innerWidth > 760;
    const cam = map.cameraForBounds([[x0, y0], [x1, y1]], { bearing: -28, maxZoom: 17.3,
      padding: wide ? { top: 170, bottom: 120, left: 120, right: 420 } : { top: 140, bottom: innerHeight * 0.5, left: 30, right: 30 } });
    if (!fly || clock != null || !cam) { if (cam) map.jumpTo({ ...cam, pitch: 58 }); arrive(); return; }
    // A smooth flight: out a little, across, then down to the street
    map.flyTo({ center: cam.center, zoom: Math.min(cam.zoom, 17.3), bearing: -28, pitch: 58,
      duration: 4200, curve: 1.25, easing: ease, essential: true });
    map.once("moveend", arrive);
  }
  function clearSel(flyHome) {
    S.token++; S.sel = null; S.selT = Infinity; S.alerted = null; S.route = null; plume = []; glowSegs = []; wallLabels = [];
    $("panel").classList.add("off"); $("toast").classList.remove("on"); $("search").value = "";
    if (flyHome) map.flyTo({ ...START, duration: 3000, curve: 1.3, easing: ease, essential: true });
  }


  // ---------- Search ----------
  const inp = $("search"), res = $("results");
  let hits = [], hi = 0;
  function renderHits() {
    res.innerHTML = hits.map((s, i) => `<div class="res ${i === hi ? "sel" : ""}" data-i="${i}"><span>${nm(s)}</span><span class="pm" style="background:${css(color(s.pm))}">${s.pm}</span></div>`).join("");
    res.classList.toggle("on", hits.length > 0);
    res.querySelectorAll(".res").forEach(el => el.onmousedown = e => { e.preventDefault(); choose(+el.dataset.i); });
  }
  function choose(i) { const s = hits[i]; if (!s) return; inp.value = nm(s); res.classList.remove("on"); inp.blur(); select(s.key, true); }
  inp.addEventListener("input", () => {
    const q = inp.value.trim().toLowerCase().replace(/^nimman\b/, "nimmanhaemin road");
    hi = 0;
    if (!q) { hits = []; renderHits(); return; }
    const words = q.split(/\s+/);
    const words2 = inp.value.trim().replace(/^นิมมานฯ?/, "นิมมาน").split(/\s+/);
    hits = named.filter(s => { const n = s.name.toLowerCase(), th = s.nameTh || "";
        return words.every(w => n.includes(w)) || (th && words2.every(w => th.includes(w))); })
      .sort((a, b) => nm(a).length - nm(b).length).slice(0, 8);
    renderHits();
  });
  inp.addEventListener("keydown", e => {
    if (e.key === "ArrowDown") { hi = Math.min(hits.length - 1, hi + 1); renderHits(); e.preventDefault(); }
    if (e.key === "ArrowUp") { hi = Math.max(0, hi - 1); renderHits(); e.preventDefault(); }
    if (e.key === "Enter") choose(hi);
    if (e.key === "Escape") { res.classList.remove("on"); inp.blur(); }
  });
  inp.addEventListener("blur", () => setTimeout(() => res.classList.remove("on"), 120));

  // ---------- Presenter keys (not shown on screen) ----------
  window.addEventListener("keydown", e => {
    if (document.activeElement === inp) return;
    if (e.key === "s" || e.key === "S") { inp.value = nm(streets.get("Nimmanhaemin Road Soi 7")); select("Nimmanhaemin Road Soi 7", true); }
    if (e.key === "l" || e.key === "L") setLang(lang === "en" ? "th" : "en");
    if (e.key === "t" || e.key === "T") setTheme(theme === "light" ? "dark" : "light", true);
    if (e.key === "r" || e.key === "R") { const st = streets.get(S.sel || "Nimmanhaemin Road Soi 7"); S.near = cleanerNear(st); startRoute(st, PLACES[0]); }
    if (e.key === "a" || e.key === "A") { const b = $("alertBtn"); if (b) b.click(); }
    if (e.key === "Escape") clearSel(true);
    if (e.key === "/") { e.preventDefault(); inp.focus(); }
  });

  // ---------- Language ----------
  function setLang(l) {
    lang = l; try { localStorage.setItem("fahsai-lang", l); } catch (e) {}
    document.documentElement.lang = l;
    const T = t();
    $("brand").textContent = brand(); $("toastApp").textContent = brand(); document.title = brand();
    inp.placeholder = T.search;
    $("lgTitle").textContent = T.lgTitle; $("lgRider").textContent = T.lgRider; $("lgSmoke").textContent = T.lgSmoke;
    $("feedTitle").textContent = T.feedTitle; $("toastNow").textContent = T.now;
    document.querySelectorAll("#lang button").forEach(b => b.classList.toggle("on", b.dataset.l === l));
    renderLive(); renderFeed(false);
    if (S.sel) {
      const st = streets.get(S.sel), open = !$("panel").classList.contains("off");
      if (open) { if (S.view === "route" && S.route) routePanel(); else if (S.view === "choose") routeChooser(st); else streetPanel(st, S.near); }
      inp.value = nm(st);
      if (S.route && S.route.sent) routeToast(); else if (S.alerted) toastText(st, S.near);
    }
    else if (inp.value) inp.value = "";
    if (hits.length) renderHits();
  }
  document.querySelectorAll("#lang button").forEach(b => b.onclick = () => setLang(b.dataset.l));

  // ---------- Light / dark ----------
  const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
  function setTheme(th, restyle) {
    theme = th; document.documentElement.dataset.theme = th;
    try { localStorage.setItem("fahsai-theme", th); } catch (e) {}
    $("themeBtn").innerHTML = th === "light" ? MOON : SUN; // the button shows the other mode
    if (restyle) map.setStyle(P().style, { diff: false });
  }
  $("themeBtn").onclick = () => setTheme(theme === "light" ? "dark" : "light", true);
  setTheme(theme, false);
  setLang(lang);

  // For still pictures on a machine with no graphics card: freeze time and draw 1 frame.
  window.__still = (ms, setup, readings = 0) => {
    clock = T0 + ms; if (setup) setup({ select, startRoute, streets, PLACES }); if (S.route) S.route.born = clock - 8000; if (S.sel) S.selT = clock - 5000; frame(clock);
    for (let i = 0; i < readings; i++) { clock = T0 + ms - 400 * (readings - i); pushReading(); }
    clock = T0 + ms; frame(clock);
  };
  map.on("load", () => document.fonts.ready.then(() => { if (!params.has("still")) requestAnimationFrame(frame); }));
})();
</script>
</body>
</html>
